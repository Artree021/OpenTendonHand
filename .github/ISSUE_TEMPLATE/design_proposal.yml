name: Design proposal
description: Propose a change to the mechanical or electrical architecture.
title: "[design] "
labels: ["design", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Design proposals are how this project changes its mind in public. A
        proposal here is a discussion document — it does not commit anyone to
        building it, and rejection is normal.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Kinematics / DOF allocation
        - Finger structure
        - Palm / frame
        - Tendon routing and transmission
        - Actuation (motors, gearboxes)
        - Sensing
        - Electronics / power
        - Control architecture
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph a busy person can read.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What is wrong or limited with the current approach? Reference issues or docs.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it would work. Sketches, numbers, links to papers all welcome.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: BOM cost, mass, complexity, build difficulty, which requirements change.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and open questions
    validations:
      required: false
