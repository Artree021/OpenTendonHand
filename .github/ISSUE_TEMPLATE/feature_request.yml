name: Feature request
description: Suggest a capability the hand or the tooling should have.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mechanical design
        - Electronics
        - Firmware
        - Software / SDK
        - Documentation
        - Tooling / CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the use case, not the implementation.
      placeholder: "I want to log tendon tension while teleoperating, but ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional — if you have one in mind.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this myself
          required: false
